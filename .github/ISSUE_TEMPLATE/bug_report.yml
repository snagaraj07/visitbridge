name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include your child's name or health details.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: 1. Pick Dentist  2. Tap Make the story  3. ...
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
