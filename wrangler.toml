name = "visitbridge"
main = "src/worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "visitbridge.alavai.ai", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

# Per-visitor cap on /api calls. One story is about 30 calls (story, pictures, voices).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
